# Optional: PostgreSQL instead of the default SQLite file.
#   docker compose up -d db
#   set DATABASE_URL=postgresql+psycopg://devpilot:devpilot@localhost:5432/devpilot  (and: pip install "psycopg[binary]")
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
      POSTGRES_DB: devpilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
